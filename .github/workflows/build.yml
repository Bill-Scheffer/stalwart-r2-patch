# Builds Stalwart from its own release source with FOURTEEN patches, each pinned to its exact files. Since v1.1.1
# (MainThrive MAI-1441) the numbers below are the 0.16 line's, kept so the history reads; the gaps are upstream's own now.
# Retired, each measured to pass on plain v1.1.1 and to fail on plain 0.16.27:
#  1. rust-s3's DELETE signing for R2 (rust-s3 #466): v1 has its own S3 client, which signs only what it sends.
#  2, 3. patches 0002/0003, sharing never crosses tenants (JMAP, IMAP, WebDAV ACL): v1 refuses another tenant's grantee.
#  6. patch 0006, an expired ban replaced and the next one enforced: v1's BlockedIps::block, and its registry update.
#  14. patch 0014, the whole header block in a bounce: folded into 0013 (v1's DSN code puts both on the same lines).
# The thirteen:
# 4. patches/0004-file-writes-scanned-and-capped.patch: every file stored through WebDAV PUT or JMAP FileNode/set or
#    FileNode/copy (a replacement blobId; v1's FileNodeWriter::resolve_blob) is streamed to clamd
#    (STALWART_FILE_SCAN_CLAMD) first and refused if infected or unscannable (fail closed), and JMAP gets the file-size
#    cap WebDAV already has. Upstream scans mail (the milter) but never files.
# 5. patches/0005-mail-written-into-a-mailbox-scanned.patch: mail written straight into a mailbox (IMAP APPEND, JMAP
#    Email/import, a JMAP draft) is scanned with 0004's client and refused if infected or unscannable.
# 7. patches/0007-account-writes-within-the-callers-grant.patch: a User may join a group, or be created inside one, only
#    if the caller holds every permission the group has. (The account half, updating or destroying an account beyond the
#    caller's grant, is v1's own validate_account_access.)
# 8. patches/0008-admin-verbs-without-impersonate.patch: Sieve, out-of-office, identities and issuing or revoking (by id)
#    an app password on another account, for a caller with sysAccountUpdate whose grant covers it. Upstream passes them
#    only for the account itself or `impersonate`, which also reads all mail. Nothing that reads mail widens.
# 9. patches/0009-no-logo-on-calendar-mail-and-rsvp.patch: no Stalwart logo on a calendar invitation or a reminder.
#    (v1's guest RSVP page carries none.)
# 10. patches/0010-server-wide-cap-on-large-bodies.patch: the request bodies past 1 MiB held at once stay within
#    STALWART_MAX_LARGE_UPLOAD_MIB, and the messages past 5 MiB (SMTP DATA and BDAT, IMAP APPEND) within
#    STALWART_MAX_LARGE_MESSAGE_MIB, server-wide; one past its budget is refused retryably (WebDAV 429 + Retry-After,
#    JMAP 429, SMTP 452, IMAP NO [UNAVAILABLE]), and ordinary mail is never counted. It sits beside v1's own
#    buffered-memory budget, which counts all mail and bounds no HTTP upload (measured, MAI-1000, MAI-1441).
# 11. patches/0011-spam-filter-analyses-a-bounded-start-of-each-text.patch: a data: URI's payload in an HTML part's src or
#    href is left out of the text the spam filter analyses, so a large inline image does not use up the part's budget
#    and score the message as all image. v1's MessageTexts bounds the rest (MAI-1077, MAI-1441).
# 12. patches/0012-a-two-step-code-is-accepted-once.patch: a two-step (TOTP) code is accepted once, at sign-in, to confirm
#    a password or two-step change, and to register a passkey (RFC 6238 § 5.2). The mark is per account and time step,
#    in the in-memory store every node shares, set with SET NX.
# 13. patches/0013-bounces-return-headers-as-text-rfc822-headers.patch: a bounce returns the original's header block up
#    to 64 KiB as text/rfc822-headers (RFC 6522), 7bit or 8bit, a lone CR or LF ended as a line and a byte that is not
#    UTF-8 replaced, not as message/rfc822 cut at 4 KiB (Amazon SES refused it, MAI-1036; Gmail's headers outran 4 KiB,
#    MAI-1127/MAI-1131). v1 sends text/rfc822-headers only for a DKIM2 message.
# 15. patches/0015-spam-level-moves-the-junk-line.patch: an account's spam level, one optional `spam-level` lookup row
#    keyed by its id, moves where its mail turns to Junk by rescaling its spam percentage at delivery (MAI-1070). A
#    lookup that fails, or a value that is not a line, delivers at Normal and is logged: never a deferral.
# 16. patches/0016-stalled-bodies-hold-no-budget.patch: a client that stops sending holds none of 0010's budgets beyond
#    the bytes it sent: an IMAP literal is counted as it arrives, and a body holding budget that sends nothing for
#    STALWART_BODY_IDLE_SECS (60 unset), or trickles below 16 KiB/s past that grace, is ended (HTTP 408, IMAP NO
#    [UNAVAILABLE] and the rest read and dropped, MAI-1078).
# 17. patches/0017-turning-two-step-on-proves-the-new-secret.patch: turning two-step on needs a code from the NEW secret,
#    which is then used, as 0012 marks a sign-in's; replacing a secret that is already on is refused (MAI-1100).
# 18. patches/0018-screening-verdict-at-delivery.patch: the MTA hook is passed the server's own headers (authentication
#    results, spam score), which upstream leaves empty, and at delivery an account with a `spam-screen` lookup row takes
#    a junk verdict in the topmost X-MainThrive-Screen, for mail the spam filter scored (MAI-1072).
# 19. patches/0019-queued-mail-needs-fetch-any-blob.patch: a queued message's contents download only for a caller that
#    holds fetchAnyBlob as well as sysQueuedMessageGet. v1 lets sysQueuedMessageGet alone read them, which made the
#    key that holds and releases the queue (MainThrive's mail-ops, MAI-950) a reader of every queued outbound email;
#    on 0.16 it read none (measured, MAI-1441).
# Everything else is upstream: the tag's source, its Dockerfile, its features.
# The release tag is pushed only from main; a dispatch from another branch pushes branch-<short sha>
# instead, and a pull request runs every step but the registry login and the push (MAI-1019). A release tag is
# pushed once and never re-pushed, so changing what is built means bumping VARIANT (MAI-1021).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Any new directory the build reads goes here too, or merging a change to it never rebuilds main.
    paths: [".github/workflows/build.yml", "patches/**", "scripts/**", "tests/**"]
  # No path filter: this job is the required check on main, and a check filtered out of a pull
  # request never reports, so that pull request could never merge.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One group per ref: main builds one at a time and never cancels, and each pull request
# (refs/pull/N/merge) has its own group, where a new push cancels its older run. Keyed on the ref
# rather than the event, so a dispatch from a feature branch cannot displace main's pending build:
# a group holds one pending run, and a newer one cancels it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Upstream Stalwart release, pinned by commit: a tag can move, a commit cannot.
  STALWART_TAG: v1.2.1
  STALWART_SHA: 0b1342eda2eb8a211f44e1d6308cbf9d7ed61aeb
  # The commit of hickory-dns that this release's Cargo.lock names, on stalwartlabs' fork (the same step says why).
  HICKORY_SHA: f8b92b17fa6c7d09a6959672592106ca1410937b
  # The builder's base image (rustc 1.100.0), the digest the v1.1.1 stack was first built and tested with (MAI-1441):
  # upstream's Dockerfile names a floating tag.
  CARGO_CHEF_DIGEST: sha256:4d92a0744e1fc09016839c7658af38a00157c8d542a1684b32ce60f9a364fd31
  IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch
  # The tag after the Stalwart release: bump it with any change to what is built. p<last patch>-<build of that set>:
  # a new patch resets it (p0018-1), any other change to what is built counts up (p0017-2). Until 0017 it listed every
  # patch's own suffix, and with 0017's it reached 133 characters, past a Docker tag's 128 (MAI-1100).
  VARIANT: p0019-1
  # The bug reference for every patch: plain upstream at the same release, which lacks them all, so each patch's check
  # must FAIL there on its own bug lines (and its controls PASS), or its pass here proves nothing. One reference, bumped
  # with STALWART_TAG, replaces the per-patch images of the 0.16 line (MAI-1441): every patch is re-proved on each
  # release, rather than once against the build before it. Pinned by digest.
  UPSTREAM_IMAGE: docker.io/stalwartlabs/stalwart:v1.1.1@sha256:5ebdf474b237161742fe4309396af4ae8797c938e8e6eb7e2d4837332c4f9851

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: patch

      - name: Check out Stalwart at the pinned release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: stalwartlabs/stalwart
          ref: ${{ env.STALWART_SHA }}
          path: stalwart

      - name: The build's own bug-reference check refuses a missing image, a bug-free reference or a broken harness
        run: bash patch/tests/previous-must-fail.test.sh

      - name: The release tag still names that commit
        run: |
          set -eu
          tagged=$(git ls-remote https://github.com/stalwartlabs/stalwart "refs/tags/${STALWART_TAG}" | cut -f1)
          echo "tag ${STALWART_TAG} -> ${tagged}"
          [ "$tagged" = "$STALWART_SHA" ] || { echo "::error::${STALWART_TAG} no longer points at ${STALWART_SHA}"; exit 1; }

      # ⛔ A release tag names one image, forever (MAI-1021). A main build used to re-push it with a new digest even
      # when only this workflow changed, which left the digest production pins untagged, and an untagged version is
      # the first thing a registry cleanup deletes. So a tag that already exists is never re-pushed, and a change to
      # what goes into the image must bump VARIANT; this fails a pull request that makes one without the bump. What
      # goes in: patches/**, any other file of this repo that a step up to the image build names (patch/<path>),
      # the env: values (the upstream commit, the tag itself), and every step up to and
      # including the image build, comments aside. The CI-only reference images and this step itself are left out.
      # The package is public, so this reads it without logging in.
      - name: The release tag is new, or already names this content (it is never re-pushed)
        id: release
        run: |
          set -eu
          tag="${STALWART_TAG}-${VARIANT}"
          [ "${#tag}" -le 128 ] || { echo "::error::${tag} is ${#tag} characters, past a Docker tag's 128: shorten VARIANT"; exit 1; }
          if ! have=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>&1); then
            case "$have" in *": not found"*) ;; *) echo "::error::cannot read ${IMAGE}:${tag}: ${have}"; exit 1 ;; esac
            echo "${tag} is new: a main build publishes it"
            echo publish=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r digest rev <<< "$have"
          [[ "${rev:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}:${tag} carries no revision label (got '${have}')"; exit 1; }
          git -C patch fetch -q --depth=1 origin "$rev"
          # build.yml from env: through the image build step, minus comments, the reference images and this step.
          inputs_of() {
            git -C patch show "$1:.github/workflows/build.yml" | awk '
              /^env:/ { on = 1 }
              /^      - / { if (build) exit; skip = /name: The release tag is new/; build = /name: Build with/ }
              on && !skip && !/^[[:space:]]*(#|$)/ && !/(REFERENCE|UPSTREAM)_IMAGE/'
          }
          # This repo's files those steps name: patches/** today. A script added before the build is then covered too.
          refs=$(inputs_of HEAD | { grep -oE '(^|[^[:alnum:]_-])patch/[[:alnum:]_./-]+' || true; } | sed -E 's#^[^p]?patch/##' | sort -u)
          changed=$(git -C patch diff --name-only "$rev" HEAD -- patches $refs)
          [ "$(inputs_of "$rev")" = "$(inputs_of HEAD)" ] || changed="${changed} build.yml"
          if [ -n "$changed" ]; then
            echo "::error::${tag} already names ${digest}, built from ${rev}, and what goes into the image changed since:" $changed "-- bump VARIANT"
            exit 1
          fi
          echo "${tag} already names ${digest}, built from ${rev}; nothing that goes into the image changed, so it is not re-pushed"
          echo publish=false >> "$GITHUB_OUTPUT"

      # v1 has its own S3 client (crates/s3), which signs exactly the headers it sends, so no DELETE signs a header it
      # never sends (rust-s3 #466, this repository's first patch, cannot recur); rust-s3 is gone from the lock. What is
      # left to hold here is that the checkout is upstream's commit, untouched. R2 deletes are proven on a copy bucket
      # in MainThrive's rehearsal (MAI-1441), not here: CI holds no R2 credentials.
      - name: The checkout is upstream's, untouched, and names no rust-s3
        working-directory: stalwart
        run: |
          set -eu
          ! grep -q '^name = "rust-s3"$' Cargo.lock || { echo "::error::Cargo.lock names rust-s3 again: re-check R2 DELETE signing"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::the checkout is not upstream's commit as tagged"; git status --porcelain; exit 1; }

      # hickory-dns comes from a fork under stalwartlabs, by branch (stalwartlabs/hickory-dns, stalwart/0.26), which v1.1.1
      # still names at the same commit as v0.16.27. It comes from a mirror under this account (MainThrive MAI-1285), pinned by
      # commit rather than branch, so a deleted or moved fork cannot break a cold-cache build (0.16.27's opentelemetry fork
      # did, MAI-1072) and cargo resolves the commit the lock names, never a newer one. v1 names no opentelemetry fork: it
      # dropped those crates for its own exporters. The counts fail on a release that names hickory differently: re-check
      # this step then.
      # The base image goes with it: upstream's Dockerfile builds on a floating tag, which is how the cached layer was lost and
      # what would change the compiler under a security fix. It is pinned here.
      - name: hickory-dns is the commit Stalwart's lock names, from where that commit still exists, and the builder's base is pinned
        working-directory: stalwart
        run: |
          set -eu
          ! grep -q 'opentelemetry-rust' Cargo.lock || { echo "::error::Cargo.lock names an opentelemetry-rust fork again: mirror it"; exit 1; }
          HGONE=github.com/stalwartlabs/hickory-dns
          HHERE=github.com/Bill-Scheffer/hickory-dns
          n=$(grep -c "git+https://$HGONE?branch=stalwart%2F0.26#$HICKORY_SHA" Cargo.lock || true)
          [ "$n" = 3 ] || { echo "::error::Cargo.lock names $HGONE at $HICKORY_SHA $n time(s), not 3"; exit 1; }
          n=$(grep -c "git = \"https://$HGONE\", branch = \"stalwart/0.26\"" Cargo.toml || true)
          [ "$n" = 3 ] || { echo "::error::Cargo.toml patches from $HGONE's stalwart/0.26 $n time(s), not 3"; exit 1; }
          sed -i "s#git+https://$HGONE?branch=stalwart%2F0.26#git+https://$HHERE?rev=$HICKORY_SHA#" Cargo.lock
          sed -i "s#git = \"https://$HGONE\", branch = \"stalwart/0.26\"#git = \"https://$HHERE\", rev = \"$HICKORY_SHA\"#" Cargo.toml
          ! grep -q "$HGONE" Cargo.lock Cargo.toml || { echo "::error::$HGONE is still named"; exit 1; }
          [ "$(grep -c "git+https://$HHERE?rev=$HICKORY_SHA#$HICKORY_SHA" Cargo.lock)" = 3 ] || { echo "::error::the lock moved off $HICKORY_SHA"; exit 1; }
          [ "$(grep -c "git = \"https://$HHERE\", rev = \"$HICKORY_SHA\"" Cargo.toml)" = 3 ] || { echo "::error::Cargo.toml does not pin $HICKORY_SHA"; exit 1; }
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "Cargo.lock Cargo.toml " ] || { echo "::error::changed files: $got"; exit 1; }
          # The commit itself, before a build that would only fail on it later: fetched by id, from there, and compared.
          got=$(git init -q "$RUNNER_TEMP/hickory" && git -C "$RUNNER_TEMP/hickory" fetch -q --depth=1 "https://$HHERE" "$HICKORY_SHA" && git -C "$RUNNER_TEMP/hickory" rev-parse FETCH_HEAD) \
            || { echo "::error::$HHERE no longer serves $HICKORY_SHA"; exit 1; }
          [ "$got" = "$HICKORY_SHA" ] || { echo "::error::$HHERE served $got, not $HICKORY_SHA"; exit 1; }
          n=$(grep -c "^FROM .*cargo-chef:latest-rust-slim-trixie AS chef$" Dockerfile || true)
          [ "$n" = 1 ] || { echo "::error::the Dockerfile's cargo-chef FROM line is not the one this pins ($n match)"; exit 1; }
          sed -i "s#cargo-chef:latest-rust-slim-trixie AS chef#cargo-chef:latest-rust-slim-trixie@$CARGO_CHEF_DIGEST AS chef#" Dockerfile
          grep -qxF "FROM --platform=\$BUILDPLATFORM docker.io/lukemathwalker/cargo-chef:latest-rust-slim-trixie@$CARGO_CHEF_DIGEST AS chef" Dockerfile \
            || { echo "::error::the base image was not pinned"; exit 1; }
          # Stage them, so the next step's diff under crates/ is 0004 alone.
          git add -- Cargo.lock Cargo.toml Dockerfile

      # Patches 0002, 0003 and 0006 are upstream's own since v1 and 0014 is folded into 0013 (MAI-1441): their numbers are
      # left as gaps so the history and README still read. Each step applies one patch to the tree the previous ones left,
      # requires it to change exactly its own files, and requires the diff to be the patch, byte for byte (index lines
      # aside), then stages it so the next step's diff is that patch alone.
      - name: Apply the file-write patch (scan and cap), and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0004-file-writes-scanned-and-capped.patch
          git apply --check "$P" && git apply "$P"
          # Its new file is untracked until marked, and the diff below must see it.
          git add -N -- crates/common/src/file_scan.rs
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/file_scan.rs crates/common/src/lib.rs crates/dav/src/file/update.rs crates/jmap/src/file/writer.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0004, so the next step's diff is 0005 alone.
          git add -- crates/

      - name: Apply the mail-ingest scan patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0005-mail-written-into-a-mailbox-scanned.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/email/src/message/ingest.rs crates/imap/src/op/append.rs crates/jmap/src/email/set.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0005, so the next step's diff is 0007 alone.
          git add -- crates/

      - name: Apply the account-write grant patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0007-account-writes-within-the-callers-grant.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/jmap/src/registry/mapping/principal.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0007, so the next step's diff is 0008 alone.
          git add -- crates/

      - name: Apply the admin-verbs patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0008-admin-verbs-without-impersonate.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/auth/permissions.rs crates/jmap/src/api/request.rs crates/jmap/src/blob/download.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0008, so the next step's diff is 0009 alone.
          git add -- crates/

      - name: Apply the no-logo patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0009-no-logo-on-calendar-mail-and-rsvp.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/services/src/task_manager/tasks/alarm.rs crates/services/src/task_manager/tasks/imip.rs resources/html-templates/calendar-alarm.html resources/html-templates/calendar-alarm.html.min resources/html-templates/calendar-invite.html resources/html-templates/calendar-invite.html.min " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ resources/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ and resources/ diff is not exactly the patch"; exit 1; }
          # Stage 0009, so the next step's diff is 0010 alone.
          git add -- crates/ resources/

      - name: Apply the large-body cap patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0010-server-wide-cap-on-large-bodies.patch
          git apply --check "$P" && git apply "$P"
          # Its new file is untracked until marked, and the diff below must see it.
          git add -N -- crates/utils/src/in_flight.rs
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/dav/src/request.rs crates/http-proto/Cargo.toml crates/http-proto/src/request.rs crates/http/src/request.rs crates/imap-proto/src/parser/mod.rs crates/imap-proto/src/receiver.rs crates/imap/src/core/client.rs crates/imap/src/op/append.rs crates/main/src/main.rs crates/smtp/src/core/mod.rs crates/smtp/src/inbound/session.rs crates/utils/src/in_flight.rs crates/utils/src/lib.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0010, so the next step's diff is 0011 alone.
          git add -- crates/

      - name: Apply the spam-filter text bound patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0011-spam-filter-analyses-a-bounded-start-of-each-text.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/spam-filter/src/texts.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0011, so the next step's diff is 0012 alone.
          git add -- crates/

      - name: Apply the two-step code patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0012-a-two-step-code-is-accepted-once.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/auth/authentication.rs crates/common/src/lib.rs crates/directory/src/core/secret.rs crates/jmap/src/registry/mapping/account.rs crates/jmap/src/registry/mapping/passkey.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0012, so the next step's diff is 0013 alone.
          git add -- crates/

      - name: Apply the bounce returned-headers patch (0014's header block folded in), and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0013-bounces-return-headers-as-text-rfc822-headers.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/smtp/src/queue/dsn.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0013, so the next step's diff is 0015 alone.
          git add -- crates/

      - name: Apply the spam-level patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0015-spam-level-moves-the-junk-line.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/email/src/message/delivery.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0015, so the next step's diff is 0016 alone.
          git add -- crates/

      - name: Apply the stalled-body patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0016-stalled-bodies-hold-no-budget.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/dav/src/request.rs crates/http-proto/Cargo.toml crates/http-proto/src/request.rs crates/http/src/request.rs crates/imap-proto/src/receiver.rs crates/imap/src/core/session.rs crates/utils/src/in_flight.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0016, so the next step's diff is 0017 alone.
          git add -- crates/

      - name: Apply the two-step enrolment patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0017-turning-two-step-on-proves-the-new-secret.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/directory/src/core/secret.rs crates/jmap/src/registry/mapping/account.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0017, so the next step's diff is 0018 alone.
          git add -- crates/

      - name: Apply the screening patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0018-screening-verdict-at-delivery.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/email/src/message/delivery.rs crates/smtp/src/inbound/data.rs crates/smtp/src/inbound/ehlo.rs crates/smtp/src/inbound/hooks/message.rs crates/smtp/src/inbound/mail.rs crates/smtp/src/inbound/rcpt.rs crates/smtp/src/inbound/spawn.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0018, so the next step's diff is 0019 alone.
          git add -- crates/

      - name: Apply the queued-mail patch, and prove it changed only its own file
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0019-queued-mail-needs-fetch-any-blob.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/jmap/src/blob/download.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0019, the last.
          git add -- crates/

      - name: Swap, as Stalwart's own CI adds for its release build
        run: |
          set -eu
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build with Stalwart's own Dockerfile (loaded locally, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: stalwart
          file: stalwart/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.STALWART_TAG }}-${{ env.VARIANT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.STALWART_TAG }}-${{ env.VARIANT }}
            org.opencontainers.image.description=Stalwart ${{ env.STALWART_TAG }} with scanned, capped file writes and scanned mail writes, account writes and group joins within the caller's grant, admin verbs without impersonate, no logo on calendar mail, a server-wide cap on large uploads and messages that stalled bodies cannot hold, a data: image that leaves the spam filter's text budget alone, a two-step code accepted once and turning two-step on proving the new secret, bounces returning the original's headers as text/rfc822-headers up to 64 KiB, a spam level per account, a screening verdict acted on at delivery per account, and queued mail readable only with fetchAnyBlob
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          # Only main writes the cache: a pull request reads main's, and a Rust build cache written per
          # pull request would evict main's from the repository's 10 GB.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # ⛔ Every check runs on the LOCAL image and the push comes last, so a failing build publishes
      # nothing under the tag (MAI-263 DEFERRED E23: run 36992985168 pushed an image, then failed).
      - name: The built image runs, and keeps upstream's capability
        run: |
          set -eu
          ref="${IMAGE}:${STALWART_TAG}-${VARIANT}"
          docker run --rm "$ref" --help | head -1
          docker run --rm --entrypoint getcap "$ref" /usr/local/bin/stalwart

      # Since v0.16.26 upstream's release builds require an x86-64-v2 CPU and refuse to start without one (.cargo/config.toml
      # sets target-cpu=x86-64-v2, and main.rs then compiles in a start-up check). Stalwart's Dockerfile sets RUSTFLAGS,
      # which overrides that config, so this build is baseline x86-64 and runs on any x86-64 VM. Prove it on the binary:
      # the check's message is absent here and present in upstream's own image, which shows the grep can find it.
      - name: The built image starts on any x86-64 CPU (no x86-64-v2 start-up check compiled in)
        run: |
          set -eu
          msg='This build of Stalwart requires an x86-64-v2 compatible CPU'
          has() { docker run --rm --entrypoint grep "$1" -c -a -F "$msg" /usr/local/bin/stalwart || true; }
          up=$(has "docker.io/stalwartlabs/stalwart:${STALWART_TAG}")
          [ "${up:-0}" -ge 1 ] || { echo "::error::control: upstream's ${STALWART_TAG} image should carry the check, the grep found '${up}'"; exit 1; }
          ours=$(has "${IMAGE}:${STALWART_TAG}-${VARIANT}")
          # Exactly 0, no default: an empty answer means the grep never ran on our image, which must not read as a pass.
          [ "$ours" = 0 ] || { echo "::error::the built image carries the x86-64-v2 start-up check (grep: '${ours}')"; exit 1; }
          echo "upstream's image carries the check (${up}); this build does not"

      # Each check runs on the built image, then on UPSTREAM_IMAGE, plain upstream at the same release, where it must FAIL on
      # its patch's own lines: the lines plain v1.1.1 printed (MAI-1441), less those that carry a run's own values. A
      # check that cannot fail there proves nothing about the patch.
      # 0002 and 0003 retired: upstream's own since v1 (it passes on UPSTREAM_IMAGE too). Kept as a guard against upstream.
      - name: Sharing never crosses tenants (end to end, the built image)
        run: bash patch/scripts/e2e-tenant-sharing.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: Every stored file and every message written into a mailbox is scanned (end to end, a real clamd)
        run: bash patch/scripts/e2e-file-scan.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0004 and 0005's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-file-scan.sh \
            'FAIL WebDAV: and nothing was stored' \
            'FAIL JMAP: and nothing was stored'

      # 0006 retired: upstream's own since v1 (it passes on UPSTREAM_IMAGE too; it fails on plain 0.16.27, measured in MAI-1441). Kept as a guard against upstream.
      - name: A ban that expired is enforced again on the next one (end to end, the built image)
        run: bash patch/scripts/e2e-ban-expiry.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: No takeover through a narrow key, and the admin verbs without mail reach (end to end, the built image)
        run: bash patch/scripts/e2e-admin-verbs.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0007 and 0008's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-admin-verbs.sh \
            'FAIL 0007: the key cannot add a User to a group holding a permission it lacks' \
            "FAIL 0008 SieveScript/get: shows alice's forward as the active script" \
            'FAIL 0008 SieveScript/query: the untenanted key reaches bob in tenant two too (any tenant)' \
            "FAIL 0008 SieveScript/set update: alice's spare script takes the key's upload" \
            "FAIL 0008: the key cannot read back an upload it did not make (alice's own)" \
            "FAIL 0008 SieveScript/set destroy: the ACTIVE forward cannot be deleted (upstream's rule)" \
            'FAIL 0008: alice has no active script now' \
            'FAIL forward proof: carol got NO copy: the forward stopped' \
            'FAIL 0008 SieveScript/set activate: allowed on alice' \
            'FAIL 0008 SieveScript/set destroy: the deactivated forward is deleted' \
            'FAIL 0008 VacationResponse/set: alice reads the out-of-office the key set' \
            'FAIL 0008 Identity/set: allowed on alice' \
            'FAIL 0008 x:AppPassword/set destroy: the key revokes an app password on alice by id' \
            'FAIL 0008: two concurrent revokes remove exactly the two named app passwords, five rounds'

      - name: No logo on a calendar invitation or a reminder (end to end, the built image)
        run: bash patch/scripts/e2e-no-logo.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0009's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-no-logo.sh \
            'FAIL the invitation references no cid:logo' \
            'FAIL the reminder references no cid:logo'

      - name: Large bodies and large messages held at once stay within their byte budgets, server-wide, refused retryably past them (end to end, the built image)
        run: bash patch/scripts/e2e-upload-cap.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0010's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-upload-cap.sh \
            'FAIL first: with 2 large uploads in flight, a third WebDAV PUT from another account is refused retryably' \
            'FAIL first: the WebDAV refusal says when to retry' \
            'FAIL first: and a third JMAP upload from another account too' \
            'FAIL again: with 2 large uploads in flight, a third WebDAV PUT from another account is refused retryably' \
            'FAIL again: the WebDAV refusal says when to retry' \
            'FAIL again: and a third JMAP upload from another account too' \
            'FAIL with 2 large messages in flight, a third by SMTP DATA is refused with 452 (the sender retries)' \
            'FAIL and one by SMTP BDAT' \
            'FAIL and an IMAP APPEND, before its literal is sent' \
            'FAIL and an IMAP APPEND with a LITERAL+ literal, read and dropped' \
            'FAIL after a 452, the same session starts a new message' \
            'FAIL a pipelined BDAT after a refused chunk is refused too' \
            'FAIL a MULTIAPPEND refused mid-way runs none of the rest of its line'

      - name: The spam filter analyses a bounded start of each message's text, and ordinary mail scores as before (end to end, the built image)
        run: bash patch/scripts/e2e-spam-text-cap.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0011's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-spam-text-cap.sh \
            "FAIL control 'the newsletter with an inline image' scores as it did before the patch" \
            'FAIL the control set scores as it did before the patch'

      - name: A two-step code is accepted once, at sign-in and to confirm a change, and turning two-step on proves the new secret, with the in-memory store in the data store and in Valkey (end to end, the built image)
        run: bash patch/scripts/e2e-totp-replay.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0012 and 0017's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-totp-replay.sh \
            'FAIL [rocksdb] the same code a second time, in the same window, is refused' \
            'FAIL [rocksdb] a code that confirmed a password change does not sign in again' \
            'FAIL [rocksdb] a code already used does not confirm a password change, and says why' \
            'FAIL [rocksdb] turning two-step on with no code is refused, and says why' \
            'FAIL [rocksdb] turning two-step on with a code from another secret is refused, and says why' \
            'FAIL [rocksdb] the code that turned two-step on does not sign in again' \
            'FAIL [rocksdb] replacing a secret that is on is refused, and says why' \
            'FAIL [valkey] the same code a second time, in the same window, is refused' \
            'FAIL [valkey] a code that confirmed a password change does not sign in again' \
            'FAIL [valkey] a code already used does not confirm a password change, and says why' \
            'FAIL [valkey] turning two-step on with no code is refused, and says why' \
            'FAIL [valkey] turning two-step on with a code from another secret is refused, and says why' \
            'FAIL [valkey] the code that turned two-step on does not sign in again' \
            'FAIL [valkey] replacing a secret that is on is refused, and says why'

      - name: A bounce returns the original's headers as text/rfc822-headers, byte for byte, 7bit or 8bit, a lone CR ended as a line, past 4 KiB up to 64 KiB (end to end, the built image)
        run: bash patch/scripts/e2e-dsn-headers.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0013's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-dsn-headers.sh \
            'FAIL the ascii bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the ascii bounce returns every header byte for byte, in 7bit' \
            'FAIL the utf8 bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the utf8 bounce returns every header byte for byte, in 8bit' \
            'FAIL the longline bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the lonecr bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the lonecr bounce ends a lone CR as a line: every CR and LF in its 7bit part is a CRLF' \
            "FAIL the gmail bounce returns the original's From, Subject and Message-ID" \
            'FAIL the gmail bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the gmail bounce returns every header byte for byte, in 7bit' \
            "FAIL the big bounce returns the original's From, Subject and Message-ID" \
            'FAIL the big bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the big bounce returns every header byte for byte, in 7bit' \
            'FAIL the huge bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the huge bounce returns its headers up to the 64 KiB cap, cut at a whole line' \
            'FAIL the latin1 bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the latin1 bounce returns its headers, the byte that is not UTF-8 replaced, in 8bit'

      - name: An account's spam level moves its Junk line, with a webmail rule and without one, and a level that cannot be read delivers at Normal (end to end, the built image)
        run: bash patch/scripts/e2e-spam-level.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0015's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-spam-level.sh \
            'FAIL Strict (40): the low message goes to Junk, Yes, and the folder rule does not run' \
            'FAIL Lenient (70): the high message is filed by the rule, No, not Junk' \
            'FAIL Strict (40) with no script: the low message goes to Junk, Yes' \
            'FAIL Lenient (70) with no script: the high message stays in the Inbox, No, not Junk' \
            'FAIL the failed lookup is logged' \
            'FAIL a row that is not a line is logged'

      - name: A client that stops sending holds no budget beyond what it sent, an IMAP literal refused partway leaves its session usable, and a body or literal idle 5 s, or trickling below 16 KiB/s, is ended (end to end, the built image)
        run: bash patch/scripts/e2e-stalled-bodies.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0016's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-stalled-bodies.sh \
            'FAIL a stalled literal sent later, while the budget is full, is refused partway and read to its end' \
            'FAIL a literal that stops partway is ended after 5 s, with its session' \
            'FAIL a literal that trickles below 16 KiB/s after the 5 s grace is refused, read to its end' \
            'FAIL while two stalled uploads hold 26 MiB, a third is refused (the budget is held)' \
            'FAIL an HTTP body that sends nothing for longer than 5 s is ended' \
            'FAIL a stalled JMAP upload is ended the same way' \
            'FAIL an HTTP body that trickles below 16 KiB/s after the 5 s grace is ended with 408'

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any
      # other branch pushes the same tested image under branch-<short sha> alone, never the release tag,
      # so a lane can pin it by digest before merge. A pull request (ref refs/pull/N/merge) never logs in
      # or pushes.
      - if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The hook is passed the server's headers, and a junk verdict is acted on only by an account that opted in, read from the topmost copy of mail the spam filter scored (end to end, the built image)
        run: bash patch/scripts/e2e-spam-screen.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0018's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-spam-screen.sh \
            'FAIL the hook is passed Authentication-Results' \
            'FAIL the hook is passed Received-SPF' \
            'FAIL the hook is passed X-Spam-Result' \
            'FAIL the hook is passed X-Spam-Score' \
            "FAIL a junk verdict: the spam-screen account's copy goes to Junk, Yes" \
            "FAIL the service's junk over two forged passes: Junk, Yes, one verdict stored" \
            'FAIL junk above pass: only the topmost counts: Junk, Yes' \
            "FAIL the header's name in any case, its value folded: Junk, Yes" \
            'FAIL a junk verdict with a webmail folder rule: Junk, Yes, and the rule does not run' \
            'FAIL control: a pass verdict at Lenient: a high message stays in the Inbox, No (the level still applies)' \
            'FAIL the failed lookup is logged, once'

      - name: A key that manages the mail queue cannot read the mail in it (end to end, the built image)
        run: bash patch/scripts/e2e-queued-mail.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on plain upstream at the same release, on 0019's own lines
        run: |
          bash patch/scripts/previous-must-fail.sh "${UPSTREAM_IMAGE}" patch/scripts/e2e-queued-mail.sh \
            "FAIL the queue key cannot download a queued message's contents" \
            'PASS control: the queue key reads the queue' \
            "PASS control: an admin downloads the queued message's contents"

      - name: Push, only after every check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          tag="${STALWART_TAG}-${VARIANT}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
            docker tag "${IMAGE}:${STALWART_TAG}-${VARIANT}" "${IMAGE}:${tag}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${IMAGE}:${tag} ${digest#*@}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
            echo "- stalwart: \`${STALWART_TAG}\` @ \`${STALWART_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
