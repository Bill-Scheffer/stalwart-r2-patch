# Builds Stalwart from its own release source with THIRTEEN changes, each pinned to its exact files:
# 1. (retired) rust-s3 used to be taken from the commit of rust-s3 PR #467, which stops DeleteObject signing
#    headers it never sends; without it every blob DELETE against Cloudflare R2 failed with SignatureDoesNotMatch
#    (rust-s3 #466, Stalwart #3185). rust-s3 0.38.0 carries the fix (6c97cb9) and Stalwart v0.16.26 moved to it,
#    so the build now only asserts the lock still names it.
# 2. patches/0002-tenant-scoped-sharing.patch: a JMAP `shareWith` or IMAP `SETACL` may only name an
#    account in the caller's own tenant, as the JMAP directory already requires.
#    Upstream v0.16.24 accepts any account on the server, so one customer could share with another.
#    This is open (AGPL) code, identical with or without an Enterprise licence.
# 3. patches/0003-tenant-scoped-dav-acl.patch: the same rule for a WebDAV `ACL` request (calendars,
#    address books, file folders). Upstream resolves the grantee by name and checks no tenant (its
#    principal check is commented out), which 0002 wrongly assumed it did.
# 4. patches/0004-file-writes-scanned-and-capped.patch: every file stored through WebDAV PUT or JMAP
#    FileNode/set or FileNode/copy (a replacement blobId) is streamed to clamd (STALWART_FILE_SCAN_CLAMD) first and refused if infected, or
#    if it could not be scanned (fail closed); and JMAP gets the file-size cap WebDAV already has.
#    Upstream scans mail (the milter) but never files, and JMAP checked no file size (both measured).
# 5. patches/0005-mail-written-into-a-mailbox-scanned.patch: mail written straight into a mailbox (IMAP
#    APPEND, JMAP Email/import, a JMAP draft) never passes the SMTP milter; email_ingest now scans it
#    with 0004's clamd client and refuses it if infected or unscannable (measured: all three stored EICAR).
# 6. patches/0006-expired-ban-replaced.patch: a ban that has EXPIRED is replaced when the same address
#    earns a new one, in memory and in the stored list, here and on every node. Upstream keeps the
#    expired entry (a set compared by address alone; a conflicting insert), so with a ban period set
#    every ban after the first is logged and never enforced (measured). All four ban kinds use it.
# 7. patches/0007-account-writes-within-the-callers-grant.patch: an account may be updated or destroyed only
#    by a caller that holds every permission it has (the grant rule, applied to the target as stored), and
#    may join a group only if the caller holds every permission the group has.
# 8. patches/0008-admin-verbs-without-impersonate.patch: Sieve, out-of-office, identities and issuing an app
#    password on another account, for a caller with sysAccountUpdate that 0007's rule admits. Upstream passes
#    them only for the account itself or `impersonate`, which also reads all mail. Nothing that reads mail widens.
# 9. patches/0009-no-logo-on-calendar-mail-and-rsvp.patch: no Stalwart logo on a calendar invitation, a reminder
#    or the guest RSVP page. The templates are compiled in (both editions; Enterprise can only swap the image), and
#    upstream attaches its built-in logo to every invitation and reminder (measured).
# 10. patches/0010-server-wide-cap-on-large-bodies.patch: the request bodies past 1 MiB held at once stay within
#    STALWART_MAX_LARGE_UPLOAD_MIB, and the messages past 5 MiB (SMTP DATA and BDAT, IMAP APPEND) within
#    STALWART_MAX_LARGE_MESSAGE_MIB, in bytes, server-wide; one past its budget is refused retryably (WebDAV 429 + Retry-After, JMAP 429, SMTP 452, IMAP NO
#    [UNAVAILABLE]). Upstream bounds each account, or each sender IP, only, so a burst across them could OOM-kill the
#    process (measured, MAI-1000).
# 11. patches/0011-spam-filter-analyses-a-bounded-start-of-each-text.patch: the inbound spam filter analyses the first
#    512 KiB of each part's text, plain or extracted from HTML, 1 MiB per message, and reads up to 2 MiB of HTML markup.
#    Upstream tokenizes all of it, at ~40 times the text in memory, so a 10 MiB text/plain message cost 280-466 MiB by
#    SMTP, past what 0010's budgets count (measured, MAI-1077).
# 12. patches/0012-a-two-step-code-is-accepted-once.patch: a two-step (TOTP) code is accepted once, at sign-in and to
#    confirm a password or two-step change. Upstream keeps no record, so the same code signed in again until its window
#    closed (measured, MAI-989/MAI-997; RFC 6238 § 5.2). The mark is per account and time step, in the in-memory store
#    every node shares, set with SET NX.
# 13. patches/0013-bounces-return-headers-as-text-rfc822-headers.patch: a bounce returns the original's headers as
#    text/rfc822-headers (RFC 6522), 7bit or 8bit, not as message/rfc822. Amazon SES parses a message/rfc822 part as a
#    whole message and refused Stalwart's header-only one (554, measured through real SES, MainThrive MAI-1036).
# 14. patches/0014-bounces-return-the-whole-header-block.patch: a bounce returns the original's header block up to 64 KiB,
#    not 4 KiB. A real Gmail message's trace, ARC and DKIM headers filled upstream's 4096 bytes before its From, Subject and
#    Message-ID, and that bounce went to Gmail's Spam (measured in production, MainThrive MAI-1127/MAI-1131). A header byte
#    that is not UTF-8 is replaced, where upstream returned nothing at all.
# Everything else is upstream: the tag's source, its Dockerfile, its features.
# The release tag is pushed only from main; a dispatch from another branch pushes branch-<short sha>
# instead, and a pull request runs every step but the registry login and the push (MAI-1019). A release tag is
# pushed once and never re-pushed, so changing what is built means bumping VARIANT (MAI-1021).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Any new directory the build reads goes here too, or merging a change to it never rebuilds main.
    paths: [".github/workflows/build.yml", "patches/**", "scripts/**", "tests/**"]
  # No path filter: this job is the required check on main, and a check filtered out of a pull
  # request never reports, so that pull request could never merge.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One group per ref: main builds one at a time and never cancels, and each pull request
# (refs/pull/N/merge) has its own group, where a new push cancels its older run. Keyed on the ref
# rather than the event, so a dispatch from a feature branch cannot displace main's pending build:
# a group holds one pending run, and a newer one cancels it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Upstream Stalwart release, pinned by commit: a tag can move, a commit cannot.
  STALWART_TAG: v0.16.27
  STALWART_SHA: aa47d8ef7bfba7200d3293198ac2592747b20e73
  # The first rust-s3 release whose DeleteObject signs no header it never sends (6c97cb9, rust-s3 #466).
  RUSTS3_VERSION: 0.38.0
  IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch
  # The tag after the Stalwart release: bump it with any change to what is built.
  VARIANT: tenantacl2-filescan3-banexpiry1-grant2-verbs1-nologo1-bodycap1-textcap1-totponce1-dsnhdrs1-dsnfull1
  # A FIXED image that HAS the expired-ban bug (the last build before 0006), which the ban-expiry check must FAIL
  # on the bug's own line: that proves the check can fail. ⛔ NEVER bumped with releases: every build after 0006
  # lacks the bug and PASSES the check, so it could never be the reference. Pinned by tag AND digest, because a tag
  # could be re-pushed (until MAI-1021 every main build re-pushed the current tag, which untagged this digest).
  BAN_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:v0.16.24-rusts3-505aded-tenantacl2-filescan3@sha256:6d15a5ade004aadec046b10541dccce7135122d3c8cd5361df61ec6e3822f9db
  # The same for 0007, 0008 and 0009: the last build before them, which the admin-verbs and no-logo checks must
  # FAIL on their bugs' own lines. ⛔ NEVER bumped, for the same reason.
  MAI970_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:v0.16.25-rusts3-505aded-tenantacl2-filescan3-banexpiry1@sha256:e3e1e06a762ef80c4fae432df6a41a6e48bef2648e1cd2f9a9fe38c0bc171324
  # The same for 0010: the last build before it (production's image until then), which the upload-cap check must FAIL
  # on its refusals. ⛔ NEVER bumped, for the same reason.
  MAI1000_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:v0.16.25-rusts3-505aded-tenantacl2-filescan3-banexpiry1-grant2-verbs1-nologo1@sha256:3386cb1f6a498a2b2a2a18886d566bd4db74bf184d1fcf8738da4d401a9ecc4e
  # The same for 0011: the last build before it (production's image until then), which the spam-text check must FAIL on
  # its memory and on the bound itself, and pass on its control set. ⛔ NEVER bumped, for the same reason.
  MAI1077_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:v0.16.25-rusts3-505aded-tenantacl2-filescan3-banexpiry1-grant2-verbs1-nologo1-bodycap1@sha256:31bb44037de8136c188b22f7ec6b144b846d852f166c7525d5705b7066879ab5
  # The same for 0012: the last build before it (production's image until then), which the two-step check must FAIL on
  # each reuse, and pass on its controls. ⛔ NEVER bumped, for the same reason. Pinned by its pinned- tag's digest.
  MAI997_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:pinned-bee5bddff49d@sha256:bee5bddff49d91a8acec978b85f93541fd91dcf8eccc4d7d8caa326d61e635d0
  # The same for 0013: the last build before it (production's image until then), which the bounce check must FAIL on the
  # returned part's type and encoding, and pass on its controls. ⛔ NEVER bumped, for the same reason. Pinned by the tag
  # that names that digest: production ran MAI-997's branch build, not the release tag's.
  MAI1127_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:branch-a88e016@sha256:dabddb17455449a4eabc0578ee1ecaddda166b93cadc27355cc001dad7c10e5b
  # The same for 0014: the last build before it (production's image until then), which the bounce check must FAIL on the
  # headers past 4 KiB, and pass on its controls. ⛔ NEVER bumped, for the same reason. Pinned by its pinned- tag's digest.
  MAI1131_BUG_REFERENCE_IMAGE: ghcr.io/bill-scheffer/stalwart-r2-patch:pinned-8343456bc29d@sha256:8343456bc29d04d0cf8f285d433f73a4a6228d2e5eee1f3119ff0ae14cbef3df

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          path: patch

      - name: Check out Stalwart at the pinned release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          repository: stalwartlabs/stalwart
          ref: ${{ env.STALWART_SHA }}
          path: stalwart

      - name: The build's own bug-reference check refuses a missing image, a bug-free reference or a broken harness
        run: bash patch/tests/previous-must-fail.test.sh

      - name: The release tag still names that commit
        run: |
          set -eu
          tagged=$(git ls-remote https://github.com/stalwartlabs/stalwart "refs/tags/${STALWART_TAG}" | cut -f1)
          echo "tag ${STALWART_TAG} -> ${tagged}"
          [ "$tagged" = "$STALWART_SHA" ] || { echo "::error::${STALWART_TAG} no longer points at ${STALWART_SHA}"; exit 1; }

      # ⛔ A release tag names one image, forever (MAI-1021). A main build used to re-push it with a new digest even
      # when only this workflow changed, which left the digest production pins untagged, and an untagged version is
      # the first thing a registry cleanup deletes. So a tag that already exists is never re-pushed, and a change to
      # what goes into the image must bump VARIANT; this fails a pull request that makes one without the bump. What
      # goes in: patches/**, any other file of this repo that a step up to the image build names (patch/<path>),
      # the env: values (the upstream commit, rust-s3, the tag itself), and every step up to and
      # including the image build, comments aside. The CI-only reference images and this step itself are left out.
      # The package is public, so this reads it without logging in.
      - name: The release tag is new, or already names this content (it is never re-pushed)
        id: release
        run: |
          set -eu
          tag="${STALWART_TAG}-${VARIANT}"
          if ! have=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>&1); then
            case "$have" in *": not found"*) ;; *) echo "::error::cannot read ${IMAGE}:${tag}: ${have}"; exit 1 ;; esac
            echo "${tag} is new: a main build publishes it"
            echo publish=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r digest rev <<< "$have"
          [[ "${rev:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}:${tag} carries no revision label (got '${have}')"; exit 1; }
          git -C patch fetch -q --depth=1 origin "$rev"
          # build.yml from env: through the image build step, minus comments, the reference images and this step.
          inputs_of() {
            git -C patch show "$1:.github/workflows/build.yml" | awk '
              /^env:/ { on = 1 }
              /^      - / { if (build) exit; skip = /name: The release tag is new/; build = /name: Build with/ }
              on && !skip && !/^[[:space:]]*(#|$)/ && !/REFERENCE_IMAGE/'
          }
          # This repo's files those steps name: patches/** today. A script added before the build is then covered too.
          refs=$(inputs_of HEAD | { grep -oE '(^|[^[:alnum:]_-])patch/[[:alnum:]_./-]+' || true; } | sed -E 's#^[^p]?patch/##' | sort -u)
          changed=$(git -C patch diff --name-only "$rev" HEAD -- patches $refs)
          [ "$(inputs_of "$rev")" = "$(inputs_of HEAD)" ] || changed="${changed} build.yml"
          if [ -n "$changed" ]; then
            echo "::error::${tag} already names ${digest}, built from ${rev}, and what goes into the image changed since:" $changed "-- bump VARIANT"
            exit 1
          fi
          echo "${tag} already names ${digest}, built from ${rev}; nothing that goes into the image changed, so it is not re-pushed"
          echo publish=false >> "$GITHUB_OUTPUT"

      # The R2 DELETE fix is upstream's own now: rust-s3 0.38.0 from crates.io, which Stalwart's lock names. If a later
      # release moves rust-s3, this fails, and whether the new version still signs DELETE correctly is checked then.
      - name: rust-s3 is the release carrying the R2 DELETE fix, and the checkout is upstream's, untouched
        working-directory: stalwart
        run: |
          set -eu
          got=$(python3 -c '
          import re
          s = open("Cargo.lock").read()
          print(" ".join(f"{v}|{src}" for v, src in re.findall(r"\[\[package\]\]\nname = \"rust-s3\"\nversion = \"([^\"]+)\"\nsource = \"([^\"]+)\"", s)))')
          [ "$got" = "${RUSTS3_VERSION}|registry+https://github.com/rust-lang/crates.io-index" ] \
            || { echo "::error::Cargo.lock's rust-s3 is '${got}', not ${RUSTS3_VERSION} from crates.io"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::the checkout is not upstream's commit as tagged"; git status --porcelain; exit 1; }

      - name: Apply the tenant-scoped sharing patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0002-tenant-scoped-sharing.patch
          git apply --check "$P" && git apply "$P"
          want="crates/imap/src/op/acl.rs crates/jmap/src/addressbook/set.rs crates/jmap/src/api/acl.rs crates/jmap/src/calendar/set.rs crates/jmap/src/file/copy.rs crates/jmap/src/file/set.rs crates/jmap/src/mailbox/set.rs "
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "$want" ] || { echo "::error::changed files: $got"; exit 1; }
          # The source change is the patch, byte for byte (index lines aside).
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0002, so the next step's working-tree diff under crates/ is 0003 alone.
          git add -- crates/

      - name: Apply the tenant-scoped DAV ACL patch, and prove it changed only its own file
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0003-tenant-scoped-dav-acl.patch
          git apply --check "$P" && git apply "$P"
          # Unstaged: 0003's one file, nothing else.
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/dav/src/common/acl.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0003, so the next step's working-tree diff under crates/ is 0004 alone.
          git add -- crates/

      - name: Apply the file-write patch (scan and cap), and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0004-file-writes-scanned-and-capped.patch
          git apply --check "$P" && git apply "$P"
          # Its one new file is untracked until marked, and the diff below must see it.
          git add -N -- crates/common/src/file_scan.rs
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/file_scan.rs crates/common/src/lib.rs crates/dav/src/file/update.rs crates/jmap/src/file/copy.rs crates/jmap/src/file/set.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0004 (its new file included), so the next step's diff under crates/ is 0005 alone.
          git add -- crates/

      - name: Apply the mail-ingest scan patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0005-mail-written-into-a-mailbox-scanned.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/email/src/message/ingest.rs crates/imap/src/op/append.rs crates/jmap/src/email/set.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0005, so the next step's diff under crates/ is 0006 alone.
          git add -- crates/

      - name: Apply the expired-ban patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0006-expired-ban-replaced.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/cache/reload.rs crates/common/src/network/security.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0006, so the next step's diff under crates/ is 0007 alone.
          git add -- crates/

      - name: Apply the account-write grant patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0007-account-writes-within-the-callers-grant.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/jmap/src/registry/mapping/principal.rs crates/jmap/src/registry/set.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0007, so the next step's diff under crates/ is 0008 alone.
          git add -- crates/

      - name: Apply the admin-verbs patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0008-admin-verbs-without-impersonate.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/auth/permissions.rs crates/jmap/src/api/request.rs crates/jmap/src/blob/download.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0008, so the next step's diff is 0009 alone.
          git add -- crates/

      - name: Apply the no-logo patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0009-no-logo-on-calendar-mail-and-rsvp.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          T=resources/html-templates
          [ "$got" = "crates/services/src/task_manager/alarm.rs crates/services/src/task_manager/imip.rs $T/calendar-alarm.html $T/calendar-alarm.html.min $T/calendar-invite.html $T/calendar-invite.html.min $T/calendar-rsvp.html $T/calendar-rsvp.html.min $T/calendar-rsvp.html.min.gz " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          # Binary too: the RSVP page is served from its .min.gz.
          diff <(git diff --binary -- crates/ resources/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ and resources/ diff is not exactly the patch"; exit 1; }
          # Stalwart's own test holds the .gz to the .min; hold it here too, before the long build.
          cmp <(gzip -dc $T/calendar-rsvp.html.min.gz) $T/calendar-rsvp.html.min \
            || { echo "::error::calendar-rsvp.html.min.gz does not decompress to calendar-rsvp.html.min"; exit 1; }
          # Stage 0009, so the next step's diff is 0010 alone.
          git add -- crates/ resources/

      - name: Apply the large-body cap patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0010-server-wide-cap-on-large-bodies.patch
          git apply --check "$P" && git apply "$P"
          # Its one new file is untracked until marked, and the diff below must see it.
          git add -N -- crates/utils/src/in_flight.rs
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/dav/src/request.rs crates/http-proto/Cargo.toml crates/http-proto/src/request.rs crates/http/src/request.rs crates/imap-proto/src/parser/mod.rs crates/imap-proto/src/receiver.rs crates/imap/src/core/client.rs crates/imap/src/op/append.rs crates/main/src/main.rs crates/smtp/src/core/mod.rs crates/smtp/src/inbound/session.rs crates/utils/src/in_flight.rs crates/utils/src/lib.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0010 (its new file included), so the next step's diff under crates/ is 0011 alone.
          git add -- crates/

      - name: Apply the spam-filter text bound patch, and prove it changed only its own file
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0011-spam-filter-analyses-a-bounded-start-of-each-text.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/spam-filter/src/analysis/init.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0011, so the next step's diff under crates/ is 0012 alone.
          git add -- crates/

      - name: Apply the two-step code patch, and prove it changed only its own files
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0012-a-two-step-code-is-accepted-once.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/common/src/auth/authentication.rs crates/common/src/lib.rs crates/directory/src/core/secret.rs crates/jmap/src/registry/mapping/account.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0012, so the next step's diff under crates/ is 0013 alone.
          git add -- crates/

      - name: Apply the bounce returned-headers patch, and prove it changed only its own file
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0013-bounces-return-headers-as-text-rfc822-headers.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/smtp/src/queue/dsn.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }
          # Stage 0013, so the next step's diff under crates/ is 0014 alone.
          git add -- crates/

      - name: Apply the bounce header-block patch, and prove it changed only its own file
        working-directory: stalwart
        run: |
          set -eu
          P=../patch/patches/0014-bounces-return-the-whole-header-block.patch
          git apply --check "$P" && git apply "$P"
          got=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$got" = "crates/smtp/src/queue/dsn.rs " ] \
            || { echo "::error::changed files: $got"; exit 1; }
          diff <(git diff -- crates/ | grep -v '^index ') <(grep -v '^index ' "$P") \
            || { echo "::error::the crates/ diff is not exactly the patch"; exit 1; }

      - name: Swap, as Stalwart's own CI adds for its release build
        run: |
          set -eu
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build with Stalwart's own Dockerfile (loaded locally, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: stalwart
          file: stalwart/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.STALWART_TAG }}-${{ env.VARIANT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.STALWART_TAG }}-${{ env.VARIANT }}
            org.opencontainers.image.description=Stalwart ${{ env.STALWART_TAG }} with tenant-scoped sharing (JMAP, IMAP, WebDAV), scanned, capped file writes, expired bans replaced, account writes within the caller's grant, admin verbs without impersonate, no logo on calendar mail, and a server-wide cap on large uploads and messages, and a bounded spam-filter text analysis, and a two-step code accepted once, and bounces returning the original's headers as text/rfc822-headers, up to 64 KiB, a byte that is not UTF-8 replaced
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          # Only main writes the cache: a pull request reads main's, and a Rust build cache written per
          # pull request would evict main's from the repository's 10 GB.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # ⛔ Every check runs on the LOCAL image and the push comes last, so a failing build publishes
      # nothing under the tag (MAI-263 DEFERRED E23: run 36992985168 pushed an image, then failed).
      - name: The built image runs, and keeps upstream's capability
        run: |
          set -eu
          ref="${IMAGE}:${STALWART_TAG}-${VARIANT}"
          docker run --rm "$ref" --help | head -1
          docker run --rm --entrypoint getcap "$ref" /usr/local/bin/stalwart

      # Since v0.16.26 upstream's release builds require an x86-64-v2 CPU and refuse to start without one (.cargo/config.toml
      # sets target-cpu=x86-64-v2, and main.rs then compiles in a start-up check). Stalwart's Dockerfile sets RUSTFLAGS,
      # which overrides that config, so this build is baseline x86-64 and runs on any x86-64 VM. Prove it on the binary:
      # the check's message is absent here and present in upstream's own image, which shows the grep can find it.
      - name: The built image starts on any x86-64 CPU (no x86-64-v2 start-up check compiled in)
        run: |
          set -eu
          msg='This build of Stalwart requires an x86-64-v2 compatible CPU'
          has() { docker run --rm --entrypoint grep "$1" -c -a -F "$msg" /usr/local/bin/stalwart || true; }
          up=$(has "docker.io/stalwartlabs/stalwart:${STALWART_TAG}")
          [ "${up:-0}" -ge 1 ] || { echo "::error::control: upstream's ${STALWART_TAG} image should carry the check, the grep found '${up}'"; exit 1; }
          ours=$(has "${IMAGE}:${STALWART_TAG}-${VARIANT}")
          # Exactly 0, no default: an empty answer means the grep never ran on our image, which must not read as a pass.
          [ "$ours" = 0 ] || { echo "::error::the built image carries the x86-64-v2 start-up check (grep: '${ours}')"; exit 1; }
          echo "upstream's image carries the check (${up}); this build does not"

      - name: Sharing never crosses tenants (end to end, the built image)
        run: bash patch/scripts/e2e-tenant-sharing.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: Every stored file and every message written into a mailbox is scanned (end to end, a real clamd)
        run: bash patch/scripts/e2e-file-scan.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: A ban that expired is enforced again on the next one (end to end, the built image)
        run: bash patch/scripts/e2e-ban-expiry.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the fixed bug-reference image, on the bug itself, so it can tell the two apart
        run: bash patch/scripts/previous-must-fail.sh "${BAN_BUG_REFERENCE_IMAGE}"

      - name: No takeover through a narrow key, and the admin verbs without mail reach (end to end, the built image)
        run: bash patch/scripts/e2e-admin-verbs.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0007 and 0008, on both bugs, so it can tell the two apart
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI970_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-admin-verbs.sh \
            'FAIL 0007: the key cannot destroy an Admin' \
            'FAIL 0007: the key cannot add a User to a group holding a permission it lacks' \
            'FAIL forward proof: carol got NO copy: the forward stopped'

      - name: No logo on a calendar invitation, a reminder or the RSVP page (end to end, the built image)
        run: bash patch/scripts/e2e-no-logo.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0009, on the logo itself, so it can tell the two apart
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI970_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-no-logo.sh \
            'FAIL the invitation references no cid:logo' \
            'FAIL the reminder references no cid:logo' \
            'FAIL the RSVP page carries no Stalwart logo SVG'

      - name: Large bodies and large messages held at once stay within their byte budgets, server-wide, refused retryably past them (end to end, the built image)
        run: bash patch/scripts/e2e-upload-cap.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0010, on its refusals, so it can tell the two apart
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1000_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-upload-cap.sh \
            'FAIL first: with 2 large uploads in flight, a third WebDAV PUT from another account is refused retryably' \
            'FAIL first: and a third JMAP upload from another account too' \
            'FAIL with 2 large messages in flight, a third by SMTP DATA is refused with 452 (the sender retries)' \
            'FAIL and one by SMTP BDAT' \
            'FAIL and an IMAP APPEND, before its literal is sent' \
            'FAIL and an IMAP APPEND with a LITERAL+ literal, read and dropped'

      - name: The spam filter analyses a bounded start of each message's text, and ordinary mail scores as before (end to end, the built image)
        run: bash patch/scripts/e2e-spam-text-cap.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      # The control set's verdict is required too: it scores the same on the image before 0011 (each control is listed
      # in the log).
      - name: The same check FAILS on the last image before 0011, on its memory and its bounds, and its control set PASSES there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1077_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-spam-text-cap.sh \
            'FAIL and receiving, filtering and delivering it costs under 150 MiB, not ~40 times its text' \
            'FAIL a URL past the first 512 KiB of a text part is not analysed' \
            'FAIL a URL at the start of a third text part, past the first 1 MiB of the message, is not analysed' \
            "FAIL a URL past the first 512 KiB of an HTML part's text is not analysed" \
            'PASS the control set scores as it did before the patch'

      - name: A two-step code is accepted once, at sign-in and to confirm a change, with the in-memory store in the data store and in Valkey (end to end, the built image)
        run: bash patch/scripts/e2e-totp-replay.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0012, on each reuse in both stores, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI997_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-totp-replay.sh \
            'FAIL [rocksdb] the same code a second time, in the same window, is refused' \
            'FAIL [rocksdb] a code that confirmed a password change does not sign in again' \
            'FAIL [rocksdb] a code already used does not confirm a password change, and says why' \
            'PASS [rocksdb] every control passes' \
            'FAIL [valkey] the same code a second time, in the same window, is refused' \
            'FAIL [valkey] a code that confirmed a password change does not sign in again' \
            'FAIL [valkey] a code already used does not confirm a password change, and says why' \
            'PASS [valkey] every control passes' \
            'PASS [valkey] control: the in-memory store is Valkey'

      - name: A bounce returns the original's headers as text/rfc822-headers, byte for byte, 7bit or 8bit, a lone CR ended as a line, past 4 KiB up to 64 KiB (end to end, the built image)
        run: bash patch/scripts/e2e-dsn-headers.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0013, on the part's type and encoding, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1127_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-dsn-headers.sh \
            'FAIL the ascii bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the ascii bounce returns every header byte for byte, in 7bit' \
            "PASS control: the ascii bounce's third part carries the original's Message-ID" \
            'FAIL the utf8 bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the utf8 bounce returns every header byte for byte, in 8bit' \
            "PASS control: the utf8 bounce's third part carries the original's Message-ID" \
            'FAIL the longline bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            "PASS control: the longline bounce's third part carries the original's Message-ID" \
            'FAIL the lonecr bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the lonecr bounce ends a lone CR as a line: every CR and LF in its 7bit part is a CRLF' \
            "PASS control: the lonecr bounce's third part carries the original's Message-ID"

      - name: The same check FAILS on the last image before 0014, on the headers past 4 KiB and a byte that is not UTF-8, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1131_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-dsn-headers.sh \
            "PASS setup: the gmail original's From, Subject and Message-ID start past byte 4096 of its headers" \
            "PASS control: the gmail bounce's third part starts with the original's first header" \
            "FAIL the gmail bounce returns the original's From, Subject and Message-ID" \
            'FAIL the gmail bounce returns every header byte for byte, in 7bit' \
            "PASS setup: the big original's From, Subject and Message-ID start past byte 4096 of its headers" \
            "PASS control: the big bounce's third part starts with the original's first header" \
            "FAIL the big bounce returns the original's From, Subject and Message-ID" \
            'FAIL the big bounce returns every header byte for byte, in 7bit' \
            "PASS control: the huge bounce's third part carries the original's Message-ID" \
            'FAIL the huge bounce returns its headers up to the 64 KiB cap, cut at a whole line' \
            "PASS control: the latin1 bounce reports its own recipient" \
            'FAIL the latin1 bounce returns its headers, the byte that is not UTF-8 replaced, in 8bit' \
            'PASS the ascii bounce returns every header byte for byte, in 7bit' \
            'PASS the lonecr bounce ends a lone CR as a line: every CR and LF in its 7bit part is a CRLF'

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any
      # other branch pushes the same tested image under branch-<short sha> alone, never the release tag,
      # so a lane can pin it by digest before merge. A pull request (ref refs/pull/N/merge) never logs in
      # or pushes.
      - if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, only after every check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          tag="${STALWART_TAG}-${VARIANT}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
            docker tag "${IMAGE}:${STALWART_TAG}-${VARIANT}" "${IMAGE}:${tag}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${IMAGE}:${tag} ${digest#*@}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
            echo "- stalwart: \`${STALWART_TAG}\` @ \`${STALWART_SHA}\`"
            echo "- rust-s3: \`${RUSTS3_VERSION}\` (crates.io)"
          } >> "$GITHUB_STEP_SUMMARY"
