      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build with Stalwart's own Dockerfile (loaded locally, not pushed yet)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: stalwart
          file: stalwart/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.STALWART_TAG }}-${{ env.VARIANT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.STALWART_TAG }}-${{ env.VARIANT }}
            org.opencontainers.image.description=Stalwart ${{ env.STALWART_TAG }} with tenant-scoped sharing (JMAP, IMAP, WebDAV), scanned, capped file writes, expired bans replaced, account writes within the caller's grant, admin verbs without impersonate, no logo on calendar mail, and a server-wide cap on large uploads and messages, and a bounded spam-filter text analysis, and a two-step code accepted once, and bounces returning the original's headers as text/rfc822-headers, up to 64 KiB, a byte that is not UTF-8 replaced, and a spam level per account, and turning two-step on proving the new secret, and a screening verdict acted on at delivery per account
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          # Only main writes the cache: a pull request reads main's, and a Rust build cache written per
          # pull request would evict main's from the repository's 10 GB.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # ⛔ Every check runs on the LOCAL image and the push comes last, so a failing build publishes
      # nothing under the tag (MAI-263 DEFERRED E23: run 36992985168 pushed an image, then failed).
      - name: The built image runs, and keeps upstream's capability
        run: |
          set -eu
          ref="${IMAGE}:${STALWART_TAG}-${VARIANT}"
          docker run --rm "$ref" --help | head -1
          docker run --rm --entrypoint getcap "$ref" /usr/local/bin/stalwart

      # Since v0.16.26 upstream's release builds require an x86-64-v2 CPU and refuse to start without one (.cargo/config.toml
      # sets target-cpu=x86-64-v2, and main.rs then compiles in a start-up check). Stalwart's Dockerfile sets RUSTFLAGS,
      # which overrides that config, so this build is baseline x86-64 and runs on any x86-64 VM. Prove it on the binary:
      # the check's message is absent here and present in upstream's own image, which shows the grep can find it.
      - name: The built image starts on any x86-64 CPU (no x86-64-v2 start-up check compiled in)
        run: |
          set -eu
          msg='This build of Stalwart requires an x86-64-v2 compatible CPU'
          has() { docker run --rm --entrypoint grep "$1" -c -a -F "$msg" /usr/local/bin/stalwart || true; }
          up=$(has "docker.io/stalwartlabs/stalwart:${STALWART_TAG}")
          [ "${up:-0}" -ge 1 ] || { echo "::error::control: upstream's ${STALWART_TAG} image should carry the check, the grep found '${up}'"; exit 1; }
          ours=$(has "${IMAGE}:${STALWART_TAG}-${VARIANT}")
          # Exactly 0, no default: an empty answer means the grep never ran on our image, which must not read as a pass.
          [ "$ours" = 0 ] || { echo "::error::the built image carries the x86-64-v2 start-up check (grep: '${ours}')"; exit 1; }
          echo "upstream's image carries the check (${up}); this build does not"

      - name: Sharing never crosses tenants (end to end, the built image)
        run: bash patch/scripts/e2e-tenant-sharing.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: Every stored file and every message written into a mailbox is scanned (end to end, a real clamd)
        run: bash patch/scripts/e2e-file-scan.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: A ban that expired is enforced again on the next one (end to end, the built image)
        run: bash patch/scripts/e2e-ban-expiry.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the fixed bug-reference image, on the bug itself, so it can tell the two apart
        run: bash patch/scripts/previous-must-fail.sh "${BAN_BUG_REFERENCE_IMAGE}"

      - name: No takeover through a narrow key, and the admin verbs without mail reach (end to end, the built image)
        run: bash patch/scripts/e2e-admin-verbs.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0007 and 0008, on both bugs, so it can tell the two apart
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI970_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-admin-verbs.sh \
            'FAIL 0007: the key cannot destroy an Admin' \
            'FAIL 0007: the key cannot add a User to a group holding a permission it lacks' \
            'FAIL forward proof: carol got NO copy: the forward stopped'

      - name: The same check FAILS on the last image before -verbs2, on the revoke by id and the concurrent pair
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1018_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-admin-verbs.sh \
            'FAIL 0008 x:AppPassword/set destroy: the key revokes an app password on alice by id' \
            'FAIL 0008: two concurrent revokes remove exactly the two named app passwords, five rounds' \
            'PASS 0008 x:AppPassword/set create: the import credential is issued on alice' \
            'PASS 0008 x:AppPassword/set destroy: refused on an Admin (opsadm)' \
            'PASS 0008 x:AppPassword/set destroy: refused on alice without sysAccountUpdate' \
            'PASS 0008: x:AppPassword/set update on alice is still refused (issue and revoke only)'

      - name: No logo on a calendar invitation, a reminder or the RSVP page (end to end, the built image)
        run: bash patch/scripts/e2e-no-logo.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0009, on the logo itself, so it can tell the two apart
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI970_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-no-logo.sh \
            'FAIL the invitation references no cid:logo' \
            'FAIL the reminder references no cid:logo' \
            'FAIL the RSVP page carries no Stalwart logo SVG'

      - name: Large bodies and large messages held at once stay within their byte budgets, server-wide, refused retryably past them (end to end, the built image)
        run: bash patch/scripts/e2e-upload-cap.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0010, on its refusals, so it can tell the two apart
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1000_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-upload-cap.sh \
            'FAIL first: with 2 large uploads in flight, a third WebDAV PUT from another account is refused retryably' \
            'FAIL first: and a third JMAP upload from another account too' \
            'FAIL with 2 large messages in flight, a third by SMTP DATA is refused with 452 (the sender retries)' \
            'FAIL and one by SMTP BDAT' \
            'FAIL and an IMAP APPEND, before its literal is sent' \
            'FAIL and an IMAP APPEND with a LITERAL+ literal, read and dropped'

      - name: The spam filter analyses a bounded start of each message's text, and ordinary mail scores as before (end to end, the built image)
        run: bash patch/scripts/e2e-spam-text-cap.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      # The control set's verdict is required too: it scores the same on the image before 0011 (each control is listed
      # in the log).
      - name: The same check FAILS on the last image before 0011, on its memory and its bounds, and its control set PASSES there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1077_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-spam-text-cap.sh \
            'FAIL and receiving, filtering and delivering it costs under 150 MiB, not ~40 times its text' \
            'FAIL a URL past the first 512 KiB of a text part is not analysed' \
            'FAIL a URL at the start of a third text part, past the first 1 MiB of the message, is not analysed' \
            "FAIL a URL past the first 512 KiB of an HTML part's text is not analysed" \
            'PASS the control set scores as it did before the patch'

      - name: A two-step code is accepted once, at sign-in and to confirm a change, and turning two-step on proves the new secret, with the in-memory store in the data store and in Valkey (end to end, the built image)
        run: bash patch/scripts/e2e-totp-replay.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0012, on each reuse in both stores, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI997_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-totp-replay.sh \
            'FAIL [rocksdb] the same code a second time, in the same window, is refused' \
            'FAIL [rocksdb] a code that confirmed a password change does not sign in again' \
            'FAIL [rocksdb] a code already used does not confirm a password change, and says why' \
            'PASS [rocksdb] every control passes' \
            'FAIL [valkey] the same code a second time, in the same window, is refused' \
            'FAIL [valkey] a code that confirmed a password change does not sign in again' \
            'FAIL [valkey] a code already used does not confirm a password change, and says why' \
            'PASS [valkey] every control passes' \
            'PASS [valkey] control: the in-memory store is Valkey'

      - name: The same check FAILS on the last image before 0017, on each enrolment check in both stores, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1100_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-totp-replay.sh \
            'FAIL [rocksdb] turning two-step on with no code is refused, and says why' \
            'FAIL [rocksdb] turning two-step on with a code from another secret is refused, and says why' \
            'FAIL [rocksdb] the code that turned two-step on does not sign in again' \
            'FAIL [rocksdb] replacing a secret that is on is refused, and says why' \
            'PASS [rocksdb] the same code a second time, in the same window, is refused' \
            'PASS [rocksdb] every control passes' \
            'FAIL [valkey] turning two-step on with no code is refused, and says why' \
            'FAIL [valkey] turning two-step on with a code from another secret is refused, and says why' \
            'FAIL [valkey] the code that turned two-step on does not sign in again' \
            'FAIL [valkey] replacing a secret that is on is refused, and says why' \
            'PASS [valkey] the same code a second time, in the same window, is refused' \
            'PASS [valkey] every control passes' \
            'PASS [valkey] control: the in-memory store is Valkey'

      - name: A bounce returns the original's headers as text/rfc822-headers, byte for byte, 7bit or 8bit, a lone CR ended as a line, past 4 KiB up to 64 KiB (end to end, the built image)
        run: bash patch/scripts/e2e-dsn-headers.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0013, on the part's type and encoding, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1127_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-dsn-headers.sh \
            'FAIL the ascii bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the ascii bounce returns every header byte for byte, in 7bit' \
            "PASS control: the ascii bounce's third part carries the original's Message-ID" \
            'FAIL the utf8 bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the utf8 bounce returns every header byte for byte, in 8bit' \
            "PASS control: the utf8 bounce's third part carries the original's Message-ID" \
            'FAIL the longline bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            "PASS control: the longline bounce's third part carries the original's Message-ID" \
            'FAIL the lonecr bounce returns the headers as text/rfc822-headers, not message/rfc822' \
            'FAIL the lonecr bounce ends a lone CR as a line: every CR and LF in its 7bit part is a CRLF' \
            "PASS control: the lonecr bounce's third part carries the original's Message-ID"

      - name: The same check FAILS on the last image before 0014, on the headers past 4 KiB and a byte that is not UTF-8, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1131_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-dsn-headers.sh \
            "PASS setup: the gmail original's From, Subject and Message-ID start past byte 4096 of its headers" \
            "PASS control: the gmail bounce's third part starts with the original's first header" \
            "FAIL the gmail bounce returns the original's From, Subject and Message-ID" \
            'FAIL the gmail bounce returns every header byte for byte, in 7bit' \
            "PASS setup: the big original's From, Subject and Message-ID start past byte 4096 of its headers" \
            "PASS control: the big bounce's third part starts with the original's first header" \
            "FAIL the big bounce returns the original's From, Subject and Message-ID" \
            'FAIL the big bounce returns every header byte for byte, in 7bit' \
            "PASS control: the huge bounce's third part carries the original's Message-ID" \
            'FAIL the huge bounce returns its headers up to the 64 KiB cap, cut at a whole line' \
            "PASS control: the latin1 bounce reports its own recipient" \
            'FAIL the latin1 bounce returns its headers, the byte that is not UTF-8 replaced, in 8bit' \
            'PASS the ascii bounce returns every header byte for byte, in 7bit' \
            'PASS the lonecr bounce ends a lone CR as a line: every CR and LF in its 7bit part is a CRLF'

      - name: An account's spam level moves its Junk line, with a webmail rule and without one, and a level that cannot be read delivers at Normal (end to end, the built image)
        run: bash patch/scripts/e2e-spam-level.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0015, on Strict, Lenient and what 0015 logs, and Normal PASSES there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1070_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-spam-level.sh \
            "PASS setup: every low message scores from 4.0 to 5.0, between Strict's line and Normal's" \
            "PASS setup: every high message scores from 5.0 to 7.0, between Normal's line and Lenient's" \
            'FAIL Strict (40): the low message goes to Junk, Yes, and the folder rule does not run' \
            'PASS control: Strict (40): the high message goes to Junk, Yes' \
            'PASS control: Normal (no row): the low message is filed by the rule, No' \
            'PASS control: Normal (no row): the high message goes to Junk, Yes' \
            'PASS control: Lenient (70): the low message is filed by the rule, No' \
            'FAIL Lenient (70): the high message is filed by the rule, No, not Junk' \
            'FAIL Strict (40) with no script: the low message goes to Junk, Yes' \
            'PASS control: Strict (40) with no script: the high message goes to Junk, Yes' \
            'PASS control: Lenient (70) with no script: the low message stays in the Inbox, No' \
            'FAIL Lenient (70) with no script: the high message stays in the Inbox, No, not Junk' \
            'PASS a row that is not a line (0) delivers at Normal: the low message is filed by the rule, No' \
            'PASS a row that is not a line (0) delivers at Normal: the high message goes to Junk, Yes' \
            'PASS a row that is not a line (100) delivers at Normal: the low message is filed by the rule, No' \
            'PASS a row that is not a line (100) delivers at Normal: the high message goes to Junk, Yes' \
            'PASS a row that is not a line (strict) delivers at Normal: the low message is filed by the rule, No' \
            'PASS a row that is not a line (strict) delivers at Normal: the high message goes to Junk, Yes' \
            'PASS with the lookup store unavailable, the message is delivered at once, not deferred' \
            'PASS control: and at Normal: the low message is filed by the rule, No' \
            "PASS control: Stalwart's log records every delivery" \
            'FAIL the failed lookup is logged' \
            'FAIL a row that is not a line is logged'

      - name: A client that stops sending holds no budget beyond what it sent, an IMAP literal refused partway leaves its session usable, and a body or literal idle 5 s, or trickling below 16 KiB/s, is ended (end to end, the built image)
        run: bash patch/scripts/e2e-stalled-bodies.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      # The controls are required too: they pass on -bodycap1, so the failures are the two holes and not a broken rig.
      - name: The same check FAILS on -bodycap1, on each hold, and its controls PASS there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1077_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-stalled-bodies.sh \
            'PASS two clients each declare a 48 MiB sync literal and are told to send it' \
            'FAIL while two 48 MiB sync literals are declared and send nothing, a 52 MiB message is accepted' \
            'FAIL the literal refused partway gave back what it held at once, and the one still declared holds nothing: a 97 MiB message is accepted' \
            'FAIL a stalled literal sent later, while the budget is full, is refused partway and read to its end' \
            'PASS and its session is still usable' \
            'FAIL a literal that stops partway is ended after 5 s, with its session' \
            'FAIL and what it held comes back: a 97 MiB message is accepted' \
            'FAIL a literal that trickles below 16 KiB/s after the 5 s grace is refused, read to its end' \
            'PASS and its session is still usable after the trickle' \
            'PASS while two stalled uploads hold 26 MiB, a third is refused (the budget is held)' \
            'FAIL and its budget comes back: a following WebDAV upload is accepted' \
            'FAIL an HTTP body that sends nothing for longer than 5 s is ended' \
            'FAIL a stalled JMAP upload is ended the same way' \
            'FAIL an HTTP body that trickles below 16 KiB/s after the 5 s grace is ended with 408' \
            'PASS a slow body that keeps sending (1 MiB every 3 s) is not ended'

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any
      # other branch pushes the same tested image under branch-<short sha> alone, never the release tag,
      # so a lane can pin it by digest before merge. A pull request (ref refs/pull/N/merge) never logs in
      # or pushes.
      - if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The hook is passed the server's headers, and a junk verdict is acted on only by an account that opted in, read from the topmost copy of mail the spam filter scored (end to end, the built image)
        run: bash patch/scripts/e2e-spam-screen.sh "${IMAGE}:${STALWART_TAG}-${VARIANT}"

      - name: The same check FAILS on the last image before 0018, on the server headers, each junk verdict and the failed lookup's log, and everything a verdict must not do PASSES there
        run: |
          bash patch/scripts/previous-must-fail.sh "${MAI1072_BUG_REFERENCE_IMAGE}" patch/scripts/e2e-spam-screen.sh \
            'FAIL the hook is passed Authentication-Results' \
            'FAIL the hook is passed Received-SPF' \
            'FAIL the hook is passed X-Spam-Result' \
            'FAIL the hook is passed X-Spam-Score' \
            "PASS control: the message's own headers carry none of them" \
            'PASS setup: a low message scores from 4.0 to 5.0' \
            "FAIL a junk verdict: the spam-screen account's copy goes to Junk, Yes" \
            'PASS control: a junk verdict: the account with no row keeps its copy in the Inbox, No' \
            "PASS control: a pass verdict: the spam-screen account's copy stays in the Inbox, No" \
            'PASS control: a pass verdict: the account with no row keeps its copy in the Inbox, No' \
            "FAIL the service's junk over two forged passes: Junk, Yes, one verdict stored" \
            "PASS control: the service's pass over two forged junks: Inbox, No, one verdict stored" \
            'PASS control: a forged pass changes nothing: a high message still goes to Junk, Yes' \
            'PASS control: a forged pass changes nothing: a low message stays in the Inbox, No' \
            'PASS control: a forged junk to an account with no row: Inbox, No' \
            'PASS control: pass above junk: only the topmost counts: Inbox, No' \
            'FAIL junk above pass: only the topmost counts: Junk, Yes' \
            "FAIL the header's name in any case, its value folded: Junk, Yes" \
            "PASS control: a verdict that cannot be read (no version) leaves Stalwart's decision: Inbox, No" \
            "PASS control: a verdict that cannot be read (another version) leaves Stalwart's decision: Inbox, No" \
            "PASS control: a verdict that cannot be read (capitals) leaves Stalwart's decision: Inbox, No" \
            "PASS control: a verdict that cannot be read (a third tag) leaves Stalwart's decision: Inbox, No" \
            "PASS control: a verdict that cannot be read (a longer word) leaves Stalwart's decision: Inbox, No" \
            "PASS control: a verdict that cannot be read (empty) leaves Stalwart's decision: Inbox, No" \
            'FAIL a junk verdict with a webmail folder rule: Junk, Yes, and the rule does not run' \
            'PASS control: a pass verdict with a webmail folder rule: the rule files it, No' \
            'PASS control: a pass verdict at Lenient: a high message stays in the Inbox, No (the level still applies)' \
            'FAIL a junk verdict at Lenient: the same high message goes to Junk, Yes' \
            'PASS control: the forwarding account (no row) keeps its copy in the Inbox, No' \
            'PASS control: the forwarded copy reached the spam-screen account still carrying the old verdict' \
            'PASS a forward carrying an old junk verdict is ignored: the copy stays in the Inbox' \
            "PASS control: a signed-in user's message reached the spam-screen account carrying a typed verdict" \
            "PASS a typed verdict on a signed-in user's message is ignored: Inbox" \
            'PASS with the lookup store unavailable, the message is delivered at once, not deferred' \
            'PASS control: and as not opted in, despite the junk verdict: Inbox, No' \
            'FAIL the failed lookup is logged, once' \
            "PASS control: the message's body is never logged" \
            "PASS control: Stalwart's log records deliveries"

      - name: Push, only after every check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          tag="${STALWART_TAG}-${VARIANT}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
            docker tag "${IMAGE}:${STALWART_TAG}-${VARIANT}" "${IMAGE}:${tag}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${IMAGE}:${tag} ${digest#*@}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
            echo "- stalwart: \`${STALWART_TAG}\` @ \`${STALWART_SHA}\`"
            echo "- rust-s3: \`${RUSTS3_VERSION}\` (crates.io)"
          } >> "$GITHUB_STEP_SUMMARY"
